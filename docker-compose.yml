# Повний стек (PostgreSQL + Redis + MinIO + API + report worker): docker compose up --build
#
# Змінні для сервісу `app` беруться з `.env` у цій теці (підстановка у compose).
# DATABASE_URL для контейнера завжди на сервіс `postgres` (не localhost).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance_tracker}?schema=public
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-finance-tracker}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGNED_URL_EXPIRY_SECONDS: "${S3_PRESIGNED_URL_EXPIRY_SECONDS:-900}"
      ATTACHMENT_MAX_SIZE_BYTES: "${ATTACHMENT_MAX_SIZE_BYTES:-5242880}"
      ATTACHMENT_PRESIGNED_URL_MAX_EXPIRY_SECONDS: "${ATTACHMENT_PRESIGNED_URL_MAX_EXPIRY_SECONDS:-3600}"
      REPORT_QUEUE_NAME: "${REPORT_QUEUE_NAME:-financial-reports}"
      REPORT_JOB_ATTEMPTS: "${REPORT_JOB_ATTEMPTS:-3}"
      REPORT_JOB_BACKOFF_MS: "${REPORT_JOB_BACKOFF_MS:-2000}"
      REPORT_PDF_PRESIGNED_TTL_SECONDS: "${REPORT_PDF_PRESIGNED_TTL_SECONDS:-3600}"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/workers/index.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance_tracker}?schema=public
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-finance-tracker}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGNED_URL_EXPIRY_SECONDS: "${S3_PRESIGNED_URL_EXPIRY_SECONDS:-900}"
      RECURRING_SCHEDULER_ENABLED: "false"
      REPORT_QUEUE_NAME: "${REPORT_QUEUE_NAME:-financial-reports}"
      REPORT_JOB_ATTEMPTS: "${REPORT_JOB_ATTEMPTS:-3}"
      REPORT_JOB_BACKOFF_MS: "${REPORT_JOB_BACKOFF_MS:-2000}"
      REPORT_PDF_PRESIGNED_TTL_SECONDS: "${REPORT_PDF_PRESIGNED_TTL_SECONDS:-3600}"
      REPORT_WORKER_CONCURRENCY: "${REPORT_WORKER_CONCURRENCY:-2}"
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  seed:
    profiles: ["seed", "tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance_tracker}?schema=public
      SEED_RESET: "${SEED_RESET:-true}"
      SEED_DEMO_PASSWORD: "${SEED_DEMO_PASSWORD:-SwaggerDemo123!}"
      SEED_OTHER_PASSWORD: "${SEED_OTHER_PASSWORD:-OtherSwagger123!}"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-finance-tracker}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
