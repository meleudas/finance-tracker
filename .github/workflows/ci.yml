name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d finance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://test:test@localhost:5432/finance_tracker_test?schema=public
      JWT_ACCESS_SECRET: "ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-32"
      JWT_REFRESH_SECRET: "ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-re-32"
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -f docker/Dockerfile -t finance-tracker:ci .

      - name: npm audit (high severity, warn-only)
        run: npm audit --omit=dev --audit-level=high || true
